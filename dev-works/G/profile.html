<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
    body{
            margin: 0;
            padding: 0;
            display: flex;
        }
    /* Media query for mobile devices */
    @media only screen and (max-width: 768px)
    {
        .menu-container {
            flex-direction: column;
            }

        .menu,
        .menu2 {
            width: 100%;
            margin: 0;
            }

        .menu2 {
                margin-top: 20px;
            }

        .name {
                font-size: 30px;
            }

        .name2 {
                font-size: 24px;
            }

        .profileImg {
                width: 50%;
                max-width: 150px;
            }
        .profileform input[type="text"] {
                padding: 8px;
            }

        .profileform input[type="submit"] {
                padding: 10px 15px;
                font-size: 14px;
            }
    }

    .menu-container {
            display: flex;
            width: 100vw;
        }
    .menu {
            width: 30%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #04559b;
            color: white;
            max-width: 330px;
            border-radius: 15px;
            margin: 0 2px;
        }
    .menu2 {
            width: 100vw;
            height: 100vh;
            background-color: #04559b;
            border-radius: 15px;
            margin-right: 2px;
        }
    .menu * {
            margin: auto;
        }
    .profileImg {
            width: 70%;
            max-width: 180px;
            border-radius: 50%;
            border: 1px solid #000;
            object-fit: cover;
            margin: auto auto 10px;
        }
    .name {
            align-self: flex-start;
            font-size: 40px;
            margin-top: 2%;
            position: relative;
            width: 100%;
            text-align: center;
            font-weight: bold;
        }
    .name2 {
            align-self: flex-start;
            font-size: 30px;
            margin-top: 2%;
            margin-left: 1%;
            position: relative;
            width: 100%;
            text-align: center;
            font-weight: bold;
        }
    .name::after {
            content: "";
            width: 80%;
            height: 1px;
            position: absolute;
            background-color: gray;
            bottom: -2px;
            left: 50%;
            transform: translateX(-50%);
        }
    .menuOptions {
            display: grid;
            width: 100%;
            margin-top: -15px;
        }
    .menuOptions a {
            font-size: 30px;
            padding: 15px 0;
            text-align: center;
            width: 100%;
            color: #c2c2c2;
            cursor: pointer;
            text-decoration: none;
        }
    .menuOptions a:hover {
            color: #ff5a5a;
        }

    .menuOptions a.selected,
    .menuOptions .active {
            color: white;
        }
    .menuOptions .logout {
            padding: 10px 20px;
            background-color: #ff5a5a;
            border-radius: 25px;
            color: white;
            font-size: 24px;
            margin: 15px auto;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: background-color 0.3s;
            font-weight: bold;
            width: fit-content;
        }
    .menuOptions .logout:hover {
            background-color: #ff0000;
            color: white;
            transform: scale(1.1);
        }
    /* New CSS for showing and hiding sections based on target */
    .hidden-section {
            display: none;
        }
    .hidden-section:target {
            display: block;
        }
    .profileform {
            margin-top: 20px;
        }
    .profileform form {
            display: flex;
            flex-direction: column;
        }
    .profileform label {
            margin-bottom: 10px;
            font-weight: bold;
        }
    .profileform input[type="text"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
        }
    #yourProfile {
            padding: 20px;
        }
    .profileform input[type="submit"] {
            background-color: #ff5a5a;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            width: fit-content;
            font-size: 24px; /* Match the font size with the logout button */
            margin: 20px auto;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            transition: background-color 0.3s, transform 0.2s;
            font-weight: bold;
            font-family: inherit; /* Use the same font family as the parent element */
        }
    .profileform input[type="submit"]:hover {
            background-color: #ff0000;
            transform: scale(1.1);
        }
    .profileform label {
            margin-bottom: 10px;
            font-weight: bold;
            font-size: 18px; /* Adjust the font size as needed */
        }
</style>
</head>
<body>
    <div class="menu-container">
        <div class="menu" style="width: 30%;">
            <img src="user.png" alt="" class="profileImg">
            <span class="name">Username</span>
                <div class="menuOptions">
                    <a class="active" href="#yourProfile">Your Profile</a>
                    <a class="active" href="#research">Research</a>
                    <a class="active" href="#academics">Academics</a>
                    <a class="active" href="#professional">Professional</a>
                    <a class="logout">Logout</a>
                </div>
        </div>
        <div class="menu2" style="width: 100%;">
            <!-- Your hidden sections -->
            <div id="yourProfile" class="hidden-section">
            <!-- Content for Your Profile section -->
                <a class="name2">Your Profile</a>
                <hr>
                <div class="profileform">
                    <form action="profile.php" method="post">
                        <label for="Name"><b>Name</b></label>
                        <input type="text" placeholder="Enter Name" name="name" required><!--Name-->        
                        <label for="Designation"><b>Designation</b></label>
                        <input type="text" placeholder="Enter Designation" name="designation" required><!--Destination-->        
                        <label for="Department"><b>Department</b></label>
                        <input type="text" placeholder="Enter Department" name="department" required><!--Department-->        
                        <input type="submit"><!--Submit-->
                    </form>
                </div>            
            </div>
            <!-- Profile section ended -->
            <div id="research" class="hidden-section">
                <!-- Content for Research section -->
                    <a class="name2">Research</a>
                    <hr>
                <!-- Research section ended -->
            </div>

            <div id="academics" class="hidden-section">
                <!-- Content for Academics section -->
                    <a class="name2">Academics</a>
                    <hr>
                <!-- Academics section ended -->
            </div>

            <div id="professional" class="hidden-section">
                <!-- Content for Professional section -->
                    <a class="name2">Professional</a>
                    <hr>
                <!-- Professional section ended -->
            </div>
        </div>
    </div>
</body>

</html>
