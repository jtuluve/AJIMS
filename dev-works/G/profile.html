<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
        }

        .menu-container {
            display: flex;
            width: 100vw;
        }

        .menu {
            width: calc(30vw - 2px); /* Adjusted width with a 2px gap */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #04559b;
            color: white;
            max-width: 330px;
            border-top-right-radius: 15px;
            border-bottom-right-radius: 15px;
            margin-right: 2px; /* Added a 2px right margin */
            margin-left: 2px; 
            border-bottom-left-radius: 15px;
            border-top-left-radius: 15px;
            
        }

        .menu2 {
            width: 100vw;
            height: 100vh;
            background-color: #04559b;
            border-top-left-radius: 15px;
            border-bottom-left-radius: 15px;
            border-top-right-radius: 15px;
            border-bottom-right-radius: 15px;  
        
            margin-right: 2px;        
        }

        .menu * {
            margin: auto;
        }

        .profileImg {
            width: 70%;
            max-width: 180px;
            border-radius: 50%;
            border: 1px solid #000;
            object-fit: cover;
            margin: auto auto 10px;
        }

        .name {
            align-self: flex-start;
            font-size: 40px;
            margin-top: 10px;
            position: relative;
            width: 100%;
            text-align: center;
            font-weight: bold;
        }

        .name::after {
            content: "";
            width: 80%;
            height: 1px;
            position: absolute;
            background-color: gray;
            bottom: -2px;
            left: 50%;
            transform: translateX(-50%);
        }

        .menuOptions {
            display: grid;
            width: 100%;
            margin-top: -15px;
        }

        .menuOptions a {
            font-size: 30px;
            padding: 15px 0;
            text-align: center;
            width: 100%;
            color: #c2c2c2;
            cursor: pointer;
            text-decoration: none;
        }

        .menuOptions a:hover {
            color: #ff5a5a;
        }

        .menuOptions a.selected,
        .menuOptions .active {
            color: white;
        }

        .menuOptions .logout {
            padding: 10px 20px;
            background-color: #ff5a5a;
            border-radius: 25px;
            color: white;
            font-size: 24px;
            margin: 15px auto;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: background-color 0.3s;
            font-weight: bold;
            width: fit-content;

        }

        .menuOptions .logout:hover {
            background-color: #ff0000;
            color: white;
        }

        /* New CSS for showing and hiding sections based on target */
        .hidden-section {
            display: none;
        }

        .hidden-section:target {
            display: block;
        }

        .hidden-section {
            float: right;
        }
    </style>
</head>

<body>
    <div class="menu-container">
        <div class="menu">
            <img src="user.png" alt="" class="profileImg">
            <span class="name">Username</span>
            <div class="menuOptions">
                <a class="active" href="#yourProfile">Your Profile</a>
                <a class="active" href="#research">Research</a>
                <a class="active" href="#academics">Academics</a>
                <a class="active" href="#professional">Professional</a>
                <a class="logout">Logout</a>
            </div>
        </div>
        <div class="menu2">
            <!-- Your hidden sections -->
            <div id="yourProfile" class="hidden-section">
                <!-- Content for Your Profile section -->

                <!-- ... -->
            </div>

            <div id="research" class="hidden-section">
                <!-- Content for Research section -->

                <!-- ... -->
            </div>

            <div id="academics" class="hidden-section">
                <!-- Content for Academics section -->

                <!-- ... -->
            </div>

            <div id="professional" class="hidden-section">
                <!-- Content for Professional section -->

                <!-- ... -->
            </div>
        </div>
    </div>
</body>

</html>
