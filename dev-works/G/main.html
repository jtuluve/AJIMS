<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <style>        
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow-y: hidden;
            overflow-x: auto;
        }

        *{
            transition: all 0.3s ease;
            box-sizing: border-box;
        }
        
        .divisions {
            display: flex;
            width: 100%; 
            height: 100%;           
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            flex-direction: row;
        }
        
        .titlebar {
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #04559b;
            color: white;
            height: 8vh;
            width: 100%;
            box-shadow: 0 0 100px rgba(0, 0, 0, 0.5);
            color: white;
            border-radius: 5px;        
            border: 2px solid #000;
        }

        .titlebar .logo {
            font-size: 18px;
            scale: 20%;
            border-radius: 15%;
        }

        .titlebar .web-name {
            font-size: 18px;
            font-weight: bold;
        }

        /* New styles for boxes */
        .box {
            flex: 1;
            padding: 20px;
            margin: 10px;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            text-align: center;
            transition: transform 0.3s ease;

            max-width: 180px;
            object-fit: cover;
        }

        .box:hover {
            transform: scale(1.05);
        }

        .box img {
            max-width: 100%;
            max-height: 100%;
            border-radius: 5px;
        }
        .profileImg {
            width: 70%;
            max-width: 180px;
            border-radius: 50%;
            border: 1px solid #000;
            object-fit: cover;
            margin: auto auto 10px;
        }

    </style>
</head>
<body>
    <div class="titlebar">
        <img src="A J Logo .png" class="logo" >
        <a class="web-name">AJIMS Employment Management</a>
    </div>
    <div class="divisions">
        <!-- Box 1 -->
        <div class="box">
            <a href="modifiedright.html">
                <img src="user.png" class="profileImg">
                <a>Faculty appraisal</a>
            </a>
        </div>
        <!-- Box 2 -->
        <div class="box">
            <a href="">
                <img src="Leave Letter" alt="Leave Letter">
            </a>
        </div>
        <!-- Box 3 -->
        <div class="box">
            <a href="page3.html">
                <img src="">
            </a>
        </div>
    </div>
</body>
</html>
