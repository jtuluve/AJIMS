<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <style>        
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow-y: hidden;
            overflow-x: hidden;
            font-family: 'Arial', sans-serif;
            background-color: #f2f2f2; /* Light gray background */
        }

        .divisions {
            display: flex;
            flex-direction: column; 
            height: 100%;           
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }

        .titlebar {
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #04559b;
            color: white;
            height: 8vh;
            width: 100%;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            border-radius: 5px;        
            border: 2px solid #000;
        }

        .titlebar .logo {
            font-size: 18px;
            transform: scale(0.2);
            border-radius: 15%;
        }
        .titlebar .web-name {
            font-size: 18px;
            font-weight: bold;
        }

        /* Box styles */
        .box {
            flex: 1;
            padding: 20px;
            margin: 10px;
            background-color: #04559b;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            text-align: center;
            transition: transform 0.2s ease;
            max-width: 240px;
            max-height: 240px;
            object-fit: cover;
            position: relative;
        }

        .box:hover {
            transform: scale(1.05);
        }

        .box img {
            max-width: 100%;
            max-height: 100%;
            border-radius: 5px;
        }

        .profileImg {
            width: 80%;
            max-width: 240px;
            border-radius: 50%;
            border: 1px solid #000;
            object-fit: cover;
            margin: auto auto 10px;
        }

        .box a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            display: block;
            margin-top: 10px;
        }        
    </style>
</head>
<body>
    <div class="titlebar">
        <img src="A J Logo .png" class="logo" >
        <a class="web-name">AJIMS Employment Management</a>
    </div>
    <div class="divisions">
        <!-- Box 1 -->
        <div class="box">
            <a href="modifiedright.html">
                <img src="user.png" class="profileImg">
                <a>Faculty appraisal</a>
            </a>
        </div>
        <!-- Box 2 -->
        <div class="box">
            <a href="">
                <img src="" class="profileImg">
                <a>Leave Letter</a>
            </a>
        </div>
        <!-- Box 3 -->
        <div class="box">
            <a href="page3.html">
                <img src="">
            </a>
        </div>       
    </div>

</body>
</html>
