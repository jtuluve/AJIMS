<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AJIMS Management</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: fixed;
            flex-direction: column;
        }
        
        * {
            transition: all 0.3s ease;
            box-sizing: border-box;
        }
    
        .menu-container {
            display: flex;
            width: 100vw;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            flex-direction: column;
        }

        .titlebar {
            position: absolute;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #04559b;
            color: white;
            padding: 10px 20px;
            height: 8vh;
            width: 100vw;
            box-shadow: 0 0 100px rgba(0, 0, 0, 0.5);
            color: white;
            border-radius:5px;        
            border: #000 solid 2px;
        }
        .titlebar .logo {
            font-size: 18px;
            scale: 20%;
            border-radius: 15%;
        }

        .titlebar .web-name {
            font-size: 18px;
            font-weight: bold;
        }

        .menu {
            width: 30%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 90vh;
            background-color: #04559b;
            color: white;
            max-width: 330px;
            border-radius: 5px;
            margin: 60px 2px 10px;        
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            border: #000 solid 2px;
            bottom: 0px;
        }

        .menu * {
            margin: auto;
        }

        .profileImg {
            width: 70%;
            max-width: 180px;
            border-radius: 50%;
            object-fit: cover;
            margin: auto auto 10px;
        }

        .name {
            align-self: flex-start;
            font-size: 40px;
            margin-top: 10px;
            position: relative;
            width: 100%;
            text-align: center;
            font-weight: bold;
        }

        .name::after {
            content: "";
            width: 80%;
            height: 1px;
            position: absolute;
            background-color: gray;
            bottom: -2px;
            left: 50%;
            transform: translateX(-50%);
        }

        .menuOptions {
            display: grid;
            width: 100%;
            margin-top: -15px;
        }

        .menuOptions a {
            font-size: 30px;
            padding: 15px 0;
            text-align: center;
            width: 100%;
            color: #c2c2c2;
            cursor: pointer;
            text-decoration: none;
        }

        .menuOptions a:hover {
            color: #ff5a5a;
        }

        .menuOptions a.selected,
        .menuOptions .active {
            color: white;
        }

        .menuOptions .logout {
            padding: 10px 20px;
            background-color: #ff5a5a;
            border-radius: 25px;
            color: white;
            font-size: 24px;
            margin: 15px auto;
            transition: background-color 0.3s;
            font-weight: bold;
            width: fit-content;
        }

        .menuOptions .logout:hover {
            background-color: #ff0000;
            color: white;
        }
    </style>
</head>

<body>

    <div class="titlebar">
        <img src="A J Logo .png" class="logo" >
        <a class="web-name">AJIMS Management</a>
    </div>

    <div class="menu-container">
        <div class="menu">
            <img src="user.png" alt="" class="profileImg">
            <span class="name">Username</span>

            <div class="menuOptions">
                <a class="active" href="#yourProfile">Your Profile</a>
                <a class="active" href="#research">Research</a>
                <a class="active" href="#academics">Academics</a>
                <a class="active" href="#professional">Professional</a>
                <a class="logout">Logout</a>
            </div>
        </div>
        <div class="menu2">
            
        </div>
    </div>
</body>

</html>
