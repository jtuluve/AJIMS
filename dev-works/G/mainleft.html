<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            padding: 0;
        }

        a:visited {
            color: inherit;
        }

        .menu {
            width: 30vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #04559b;
            color: white;
            max-width: 330px;
            border-top-right-radius: 15px;
            border-bottom-right-radius: 15px;
        }

        .menu * {
            margin: auto;
        }

        .profileImg {
            width: 80%;
            max-width: 220px;
            border-radius: 50%;
            border: 1px solid #000;
            object-fit: cover;
            margin: auto auto 10px;
        }

        .name {
            align-self: flex-start;
            font-size: 40px;
            margin-top: 10px;
            position: relative;
            width: 100%;
            text-align: center;
            font-weight: bold;
        }

        .name::after {
            content: "";
            width: 80%;
            height: 1px;
            position: absolute;
            background-color: gray;
            bottom: -2px;
            left: 50%;
            transform: translateX(-50%);
        }

        .menuOptions {
            display: grid;
            width: 100%;
            margin-top: -15px;
        }

        .menuOptions button {
            font-size: 36px;
            padding: 15px 0;
            text-align: center;
            width: 100%;
            color: #c2c2c2;
            cursor: pointer;
            background: none;
            border: none;
            font-family: inherit;
        }

        .menuOptions button:hover {
            color: #ff5a5a;
        }

        .menuOptions button.selected,
        .menuOptions .button {
            color: white;
        }

        .menuOptions .logout {
            width: auto;
            padding: 10px 20px;
            background-color: #ff5a5a;
            border: none;
            border-radius: 25px;
            color: white;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            font-size: 24px;
            margin: 15px 0;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: background-color 0.3s;
            font-weight: bold;
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
        }

        .menuOptions .logout:hover {
            background-color: #ff0000;
        }
    </style>
</head>

<body>
    <div class="menu">
        <img src="user.png" alt="" class="profileImg">
        <span class="name">Username</span>
        <div class="menuOptions">
            <button class="button" onclick="showOutput('Your Profile')">Your Profile</button>
            <button class="button" onclick="showOutput('Research')">Research</button>
            <button class="button" onclick="showOutput('Academics')">Academics</button>
            <button class="button" onclick="showOutput('Professional')">Professional</button>
            <button class="logout" onclick="showOutput('Logout')">Logout</button>
        </div>
    </div>

    <span id="output1">
        
    </span>
    <span id="output2">

    </span>
    <span id="output3">

    </span>
    <span id="output4">

    </span>
    <span id="output5">
        
    </span>
</body>

</html>
