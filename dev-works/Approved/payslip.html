<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow-x: hidden;
            font-family: 'Arial', sans-serif;
            background-image: none;
        }
        a{
            text-decoration: none;
        }
        a:visited {
            color: inherit;
        }
        .titlebar {
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #131d38;
            color: white;
            height: 15vh;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            border-radius: 5px;
            outline: 2px solid #000;
            width: 100%;
        }

        .titlebar .logo {
            height: 100%;
            border-radius: 15%;
            margin-left: 20px;
        }

        .titlebar .web-name {
            color: white;
            font-size: 18px;
            font-weight: bold;
            display: block;
            margin: auto 10px auto auto;
        }

        .titlebar .logout {
            color: #ff4c4c;
            margin-right: 10px;
            cursor: pointer;
        }
        @media only screen and (max-width:768px){
            body{
                padding: 0 0;
                margin: 0 0;
                overflow-x: hidden;
                overflow-y: hidden;
            }
            
        }
    </style>
    <title>PaySlip</title>
</head>

<body>
    <div class="titlebar">
        <img src="./logo.jpg" class="logo" />
        <a class="web-name" href='/'>AJIMS Employees Management</a>
        <a title="logout" class="material-symbols-outlined logout">
            logout
        </a>
    </div>
       
</body>

</html>
