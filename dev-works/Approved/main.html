<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow-x: hidden;
            font-family: 'Arial', sans-serif;
            background-image: none;
        }
        a{
            text-decoration: none;
        }
        a:visited {
            color: inherit;
        }
        .titlebar {
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #131d38;
            color: white;
            height: 15vh;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            border-radius: 5px;
            outline: 2px solid #000;
            width: 100%;
        }

        .titlebar .logo {
            height: 100%;
            border-radius: 15%;
            margin-left: 20px;
        }

        .titlebar .web-name {
            color: white;
            font-size: 18px;
            font-weight: bold;
            display: block;
            margin: auto 10px auto auto;
        }

        .titlebar .logout {
            color: #ff4c4c;
            margin-right: 10px;
            cursor: pointer;
        }

        /* Main styles */
        .wrapper {
            display: flex;
            flex-direction: row;
            height: 100%;
            width: 100%;
        }

        .divisions {
            display: flex;
            flex-direction: column;
            height: 100%;
            background: white;
        }

        .box {
            display: flex;
            flex: 1;
            padding: 20px;
            margin: 10px;
            background-color: #131d38;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            text-align: center;
            transition: transform 0.2s ease;
            max-width: 240px;
        }

        .box:hover {
            transform: scale(1.05);
        }

        .box img {
            border-radius: 5px;
            width: 30%;
            max-width: 240px;
            border: 1px solid #000;
            background: white;
            margin: auto 0;
        }

        .box a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            display: block;
            width: 100%;
            text-align: center;
            margin-top: 10px;
            margin: auto auto auto 10px;
        }

        .profile {
            background-color: white;
            width: 100%;
            padding: 20px;
            margin: 17px;
            border-radius: 25px;
            box-shadow: 0 0 8px black;
        }

        .profile h1 {
            color: black;
            align-self: flex-start;
            font-size: 30px;
            margin-left: 1%;
            position: relative;
            width: 100%;
            font-weight: bold;
            display: block;
        }

        .profile h3 {
            color: black;
        }
    @media only screen and (max-width:768px){
            body{
                padding: 0 0;
                margin: 0 0;
                overflow-x: hidden;
            }
            .divisions{
            display: grid;
            background: white;

            }
            .wrapper{
                display: grid;
            }
            .box{
            display: flex;
            padding: 5px;
            padding-right: 70px ;
            padding-left: 70px;
            margin: 3px;
            background-color: #131d38;
            border-radius: 8px;
            transition: transform 0.2s ease;
            
            }
            .profile{
            background-color: white;
            width: fit-content;
            padding: 25px;
            margin: 17px;
            border-radius: 25px;
            box-shadow: 0 0 8px black;
            }
        }
    </style>
    <title>Dashboard</title>
</head>

<body>
    <div class="titlebar">
        <img src="./logo.jpg" class="logo" />
        <a class="web-name" href='/'>AJIMS Employees Management</a>
        <a title="logout" class="material-symbols-outlined logout">
            logout
        </a>
    </div>
    <div class="wrapper">
        <div class="divisions">
            <div class="box">
                <img src="./user.png" />
                <a href="./appraisal">Faculty appraisal</a>
            </div>
            <div class="box">
                <img src="./leave.png" />
                <a href="">Apply Leave</a>
            </div>
            <div class="box">
                <img src="./tax.png" />
                <a href="">Tax Planning</a>
            </div>
            <div class="box">
                <img src="./paySlip.png" />
                <a href="">Pay Slip</a>
            </div>
            <div class="box">
                <img src="./insurance.png" />
                <a href="">Insurance</a>
            </div>
        </div>
        <div class="profile">
            <h1>Profile</h1>
            <hr>
            <h3>Name: Fake User</h3>
            <h3>Designation: Assistant Professor</h3>
            <h3>Department: Research</h3>
    </div>
    </div>
    
   
</body>

</html>
