<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow-x: hidden;
            font-family: 'Arial', sans-serif;
            background-image: none;
        }

        a {
            text-decoration: none;
        }

        a:visited {
            color: inherit;
        }

        .titlebar {
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #131d38;
            color: white;
            height: 15vh;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            border-radius: 5px;
            outline: 2px solid #000;
            width: 100%;
        }

        .titlebar .logo {
            height: 100%;
            border-radius: 15%;
            margin-left: 20px;
        }

        .titlebar .web-name {
            color: white;
            font-size: 28px;
            font-weight: bold;
            display: flex;
        }

        .titlebar .logout {
            color: #ff4c4c;
            margin-right: 10px;
            cursor: pointer;
        }

        /* Main styles */
        .wrapper {
            display: flex;
            flex-direction: row;
            height: 100%;
            width: 100%;
        }

        .divisions {
            display: flex;
            flex-direction: column;
            height: 100%;
            background: white;
        }

        .box {
            display: flex;
            flex: 1;
            padding: 20px;
            margin: 10px;
            background-color: #131d38;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            text-align: center;
            transition: transform 0.2s ease;
            max-width: 240px;
        }

        .box:hover {
            transform: scale(1.05);
        }

        .box img {
            border-radius: 5px;
            width: 30%;
            max-width: 240px;
            border: 1px solid #000;
            background: white;
            margin: auto 0;
        }

        .box a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            display: block;
            width: 100%;
            text-align: center;
            margin-top: 10px;
            margin: auto auto auto 10px;
        }

        .profile {
            background-color: white;
            width: 100%;
            padding: 20px;
            margin: 17px;
            border-radius: 25px;
            box-shadow: 0 0 8px black;
        }

        .profile h1 {
            color: black;
            align-self: flex-start;
            font-size: 30px;
            margin-left: 1%;
            position: relative;
            width: 100%;
            font-weight: bold;
            display: block;
        }

        .profile h3 {
            color: black;
        }

        .title123 {
            font-size: 24px;
            /* Adjust the font size as needed */
            font-weight: bold;
            text-align: center;
        }

        .name123 {
            font-size: 18px;
            /* Adjust the font size as needed */
            font-style: italic;
            text-align: center;
        }

        .profileform {
            margin-top: 20px;
        }

        .profileform form {
            display: flex;
            flex-direction: column;
        }

        .profileform label {
            margin-bottom: 10px;
            font-weight: bold;
            color: black;
        }

        .profileform input[type="text"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
        }

        .profileform input[type="submit"] {
            background-color: #01a701;
            color: black;
            padding: 12px 25px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            width: fit-content;
            font-size: 24px;
            /* Match the font size with the logout button */
            margin: 20px auto;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            transition: background-color 0.3s, transform 0.2s;
            font-weight: bold;
            font-family: inherit;
            /* Use the same font family as the parent element */
        }

        .profileform input[type="submit"]:hover {
            background-color: green;
            transform: scale(1.1);
        }

        .profileform label {
            margin-bottom: 10px;
            font-weight: bold;
            font-size: 18px;
            /* Adjust the font size as needed */
        }

        .name2 {
            color: black;
            align-self: flex-start;
            font-size: 30px;
            margin-left: 1%;
            position: relative;
            width: 100%;
            font-weight: bold;
            display: block;
        }


        @media only screen and (max-width:768px) {
            body {
                overflow-x: hidden;
            }

            .titlebar .web-name {
                color: white;
                font-size: 28px;
                font-weight: bold;
                display: flex;
            }

            .title123 {
                font-size: 18px;
                /* Adjust the font size as needed */
                font-weight: bold;
                text-align: center;
            }

            .name123 {
                font-size: 12px;
                /* Adjust the font size as needed */
                font-style: italic;
                text-align: center;
            }

        }
    </style>
    <title>Home</title>
</head>

<body>
    <div class="titlebar">
        <img src="./logo.jpg" class="logo" />
        <div class="information">
            <table class="web-data">
                <tr>
                    <td class="title123">AJ Institute of Medical Sciences and Research centre</td>
                </tr>
                <tr>
                    <td class="name123">Employee Management System</td>
                </tr>
            </table>
        </div>
        <a title="logout" class="material-symbols-outlined logout" name="logout">
            logout
        </a>
    </div>
    <div class="wrapper">
        <div class="divisions">
            <div class="box">
                <img src="./user.png" />
                <a href="./appraisal">Faculty appraisal</a>
            </div>
            <div class="box">
                <img src="./leave.png" />
                <a href="">Apply Leave</a>
            </div>
            <div class="box">
                <img src="./tax.png" />
                <a href="">Tax Planning</a>
            </div>
            <div class="box">
                <img src="./paySlip.png" />
                <a href="">Pay Slip</a>
            </div>
            <div class="box">
                <img src="./insurance.png" />
                <a href="">Faculty Details</a>
            </div>
        </div>
        <div class="profile">
            <div id="yourProfile" class="hidden-section">
                <!-- Content for Your Profile section -->
                <a class="name2">Your Profile</a>
                <hr>
                <div class="profileform">
                    <form action="profile.php" method="post">
                        <label for="Name"><b>Name</b></label>
                        <input type="text" placeholder="Enter Name" name="name" required><!--Name-->
                        <label for="Designation"><b>Designation</b></label>
                        <input type="text" placeholder="Enter Designation" name="designation"
                            required><!--Destination-->
                        <label for="Department"><b>Department</b></label>
                        <input type="text" placeholder="Enter Department" name="department" required><!--Department-->
                        <input type="submit"><!--Submit-->
                    </form>
                </div>
            </div>
            <!-- Profile section ended -->
        </div>
    </div>


</body>

</html>
