<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background-image: url('ajims.png');
            background-attachment: scroll; /* Changed to scroll for a static background image */
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            display: flex;
            justify-content: flex-start; /* Aligns to the start (left) */
            align-items: center;
            height: 100vh;
            margin: 0;
        } 
        .login-container {
            width: 300px;
            background-color: rgba(255, 255, 255, 0.5); /* Semi-transparent white background */
            padding: 20px;
            border-radius: 15px; /* Added border radius */
            margin-left: 100px; /* Adjusted the left margin to 100px */
        }
        .login-container input[type="text"],
        .login-container input[type="password"] {
            width: 100%;
            padding: 12px 20px;
            margin: 8px 0;
            display: inline-block;
            border: 1px solid #ccc;
            box-sizing: border-box;
            border-radius: 5px; /* Added border radius for the input fields */
        }
        .login-container input[type="submit"] {
            width: 100%;
            background-color: #4CAF50;
            color: white;
            padding: 14px 20px;
            margin: 8px 0;
            border: none;
            cursor: pointer;
            border-radius: 5px; /* Added border radius for the submit button */
        }
        .login-container input[type="submit"]:hover {
            background-color: #45a049;
        }

        /* Media query for mobile responsiveness */
        @media only screen and (max-width: 600px) {
            body {
                justify-content: center; /* Center aligns the content horizontally */
            }
            .login-container {
                width: 80%; /* Adjusted the width for smaller screens */
                margin-left: 0; /* Removed the left margin for smaller screens */
            }
        }
    </style>
</head> 
<body>
    <div class="login-container">
        <form action="/action_page.php">
            <label for="username"><b>Username</b></label>
            <input type="text" placeholder="Enter Username" name="username" required>

            <label for="password"><b>Password</b></label>
            <input type="password" placeholder="Enter Password" name="password" required>

            <input type="submit" value="Login">
        </form>
    </div>
</body>
</html>
