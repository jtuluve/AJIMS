<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background-color: #04559b;
            overflow-x: hidden;
        }

        .tableContainer {
            overflow: auto;
        }

        table {
            width: 70vw;
            min-width: 500px;
            border: 1px solid white;
        }

        thead {
            background-color: #4472c4;
            color: white;
        }

        tbody tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        tbody tr:nth-child(odd) {
            background-color: #cfd5ea;
        }

        tbody tr:hover {
            background-color: #e9ebf5;
        }
    </style>
</head>

<body>
    <div class="tableContainer">
        <table>
            <thead>
                <tr>
                    <th style="min-width: 3ch">Sr. No.</th>
                    <th>Title</th>
                    <th>Journal Name</th>
                    <th>Quartile</th>
                    <th>Index</th>
                    <th>DOI</th>
                    <th>Authorship</th>
                    <th>Uploads</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>1</td>
                    <td><input type="text" value="The real title" required readonly></td>
                    <td><input type="text" value="The real Journal" required readonly></td>
                    <td><select name="quartile" id="quartile" required readonly>
                            <option value="">Q1</option>
                            <option value="" selected>Q2</option>
                            <option value="">Q3</option>
                            <option value="">Q4</option>
                            <option value="">No quartile</option>
                            <option value="">Nil</option>
                        </select></td>
                    <td>
                        <select name="index" required>
                            <option value="Medline" readonly>Medline</option>
                            <option value="Pubmed">Pubmed</option>
                            <option value="CSCI">CSCI</option>
                            <option value="SCI">SCI</option>
                            <option value="DC">DC</option>
                            <option value="Expanded Embase">Expanded Embase</option>
                            <option value="Scopus" selected>Scopus</option>
                            <option value="DoAJ">DoAJ</option>
                        </select>
                    </td>
                    <td><input type="text" value="The real DOI" readonly> </td>
                    <td>
                        <select name="category" readonly>
                            <option value="First">First</option>
                            <option value="Correspondant">Correspondant</option>
                            <option value="Second">Second</option>
                            <option value="Others">Others</option>
                        </select>
                    </td>
                    <td><input type="file" name="" id=""></td>
                    <td><input type="submit" value="update"></td>
                </tr>
                <tr>
                    <td>2</td>
                    <td><input type="text" required></td>
                    <td><input type="text" required></td>
                    <td><select name="quartile" id="quartile" required>
                            <option value="">Q1</option>
                            <option value="">Q2</option>
                            <option value="">Q3</option>
                            <option value="">Q4</option>
                            <option value="">No quartile</option>
                            <option value="">Nil</option>
                        </select></td>
                    <td>
                        <select name="index" required>
                            <option value="Medline">Medline</option>
                            <option value="Pubmed">Pubmed</option>
                            <option value="CSCI">CSCI</option>
                            <option value="SCI">SCI</option>
                            <option value="DC">DC</option>
                            <option value="Expanded Embase">Expanded Embase</option>
                            <option value="Scopus">Scopus</option>
                            <option value="DoAJ">DoAJ</option>
                        </select>
                    </td>
                    <td><input type="text"> </td>
                    <td>
                        <select name="category">
                            <option value="First">First</option>
                            <option value="Correspondant">Correspondant</option>
                            <option value="Second">Second</option>
                            <option value="Others">Others</option>
                        </select>
                    </td>
                    <td><input type="file" name="" id=""></td>
                    <td><input type="submit" value="update"></td>
                </tr>
            </tbody>
        </table>
    </div>
</body>

</html>
