<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: #131d38;
            color:white;
        }
        .table {
            display: grid;
            outline:1px solid gray;
            background-color: #f0f0f0;
          }
          .table > *{
            display: grid;
            grid-template-columns: repeat(7, 1fr) 50px;
          }
          .table-header h4,
          .table-row span {
            padding: 10px;
            margin:0;
            border: 1px solid #ccc;
            text-align: center;
          }
          .table-header h4{
            background-color: #132557;
          }
          .table-row{
            background-color: #cfd5ea;
            color: black;
          }
          .table-row input.edit {
            cursor: pointer;
            background-color: #05d705;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
          }
          
          .table-row input.edit:hover {
            background-color: #037a04;
          }
          
          .table-row span:hover {
            background-color: #c4c4c4;
          }
          

          /*.formWrapper form style*/
          
          .formWrapper{
            display: none;
            height: 100%;
            background: #131d38;
            width: 100%;
            top: 0;
            left: 0;
            position: fixed;
            overflow: auto;
          }
          .formWrapper form {
            padding: 20px;
            height: 100%;
            box-sizing: border-box;
          }
          
          .formWrapper form > span {
            margin-bottom: 15px;
          }
          .formWrapper form .title {
            color: white;
            text-align: center;
            margin: 10px;
          }
          .formWrapper form label {
            display: block;
            color: white;
            margin-bottom: 5px;
          }
          
          .formWrapper form input {
            width: calc(100% - 20px);
            padding: 8px;
            box-sizing: border-box;
            margin-bottom: 10px;
            border: 1px solid #fff;
            border-radius: 4px;
          }
          .formWrapper form .value {
            display: none;
          }
          .formWrapper form .edit {
            display: none;
          }
          .formWrapper form input[type="submit"] {
            background-color: #05d705;
            color: black;
            cursor: pointer;
            border: none;
            padding: 10px;
            border-radius: 4px;
            font-weight: bold;
          }
          
    </style>
</head>

<body>
    <div class="table">
        <div class="table-header">
            <h4>Title</h4>
            <h4>Journal Name</h4>
            <h4>Quartile</h4>
            <h4>Index</h4>
            <h4>DOI</h4>
            <h4>Authorship</h4>
            <h4>Uploads</h4>
        </div>
        <div class="table-row">
            <span>The title</span>
            <span>Journal Name</span>
            <span>Q1</span>
            <span>Medline</span>
            <span>The DOI</span>
            <span>First</span>
            <span>No file</span>
            <input type="submit" class="edit" id="columnEditButton" value="edit">
        </div>
    </div>
    <div class="formWrapper">
        <form action="#" method="post" id="columnForm">
    
            <span>
                <h2 class="title">Edit Information</h2>
                <label for="title">Title:</label>
    
                <input type="text" id="title" name="title" placeholder="Enter Title" required>
                <span class="value">The title</span>
            </span>
    
            <span>
                <label for="journal">Journal Name:</label>
                <input type="text" id="journal" name="journal" placeholder="Enter Journal name" required>
                <span class="value">The Journal</span>
            </span>
    
            <span>
                <label for="quartile">Quartile:</label>
                <select name="quartile" id="quartile">
                    <option value="">Q1</option>
                    <option value="">Q2</option>
                    <option value="">Q3</option>
                    <option value="">Q4</option>
                    <option value="">No quartile</option>
                    <option value="">Nil</option>
                </select>
                <span class="value">Q1</span>
            </span>
    
            <span>
                <label for="index">Index:</label>
                <input placeholder="Enter Index" type="text" id="index" name="index">
                <span class="value">Medline</span>
            </span>
            </span>
    
            <span>
                <label for="doi">DOI:</label>
                <input placeholder="Enter DOI" type="text" id="doi" name="doi" required>
                <span class="value">The DOI</span>
            </span>
            </span>
    
            <span>
                <label for="authorship">Authorship:</label>
                <input placeholder="Enter Authorship" type="text" id="authorship" name="authorship">
                <span class="value">First</span>
            </span>
            </span>
    
            <span>
                <label for="uploads">Uploads:</label>
                <input type="file" id="uploads" name="uploads">
                <span class="value">No file</span>
            </span>
    
            <span>
                <input type="button" value="edit" class="edit">
                <input type="submit" value="UPDATE" class="submit">
            </span>
    
        </form>
    </div>
    <script>
        document.getElementById("columnEditButton").onclick = ()=>{
            document.getElementsByClassName("formWrapper")[0].style.display = "block";
        }
    </script>
</body>

</html>
