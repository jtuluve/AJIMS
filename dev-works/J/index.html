<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            margin: 0;
            padding: 0;
        }
        a:visited{
            color: inherit;
        }
        .menu{
            width: 30vw;
            display: flex;
            flex-direction: column;
            place-items: center;
            height: 100vh;
            background-color: #04559b;
            color: white;
            max-width: 330px;
        }
        .menu *{
            margin: auto;
        }
        .profileImg{
            width: 80%;
            max-width: 220px;
            border-radius: 50%;
            border: 1px solid #000;
            object-fit: cover;
            margin: auto auto 10px;
        }
        
        .name{
            align-self: flex-start;
            font-size: 40px;
            margin-top:10px;
            position: relative;
            width: 100%;
            text-align: center;
            font-weight: bold;
        }
        .name::after{
            content: "";
            width: 80%;
            height: 1px;
            position: absolute;
            background-color: gray;
            bottom: -2px;
            left: 50%;
            transform: translateX(-50%);
        }
        .menuOptions{
            text-decoration: none;
            display: grid;
            width: 100%;
            margin-top: -15px;
        }
        .menuOptions a{
            font-size: 30px;
            padding: 10px 0;
            text-align: center;
            width: 100%;
            color:#c2c2c2;
            cursor: pointer;
        }
        .menuOptions a:hover{
            color: white;
        }
        .menuOptions a.selected{
            color: white;
            text-decoration: underline;
        }
        .menuOptions .logout{
            width: auto;
            color:#ff5a5a;
        }
    </style>
</head>

<body>
    <div class="menu">
        <img src="user.png" alt="" class="profileImg">
        <span class="name">First Last</span>
        <div class="menuOptions">
            <a class="selected">Your Profile</a>
            <a>Research</a>
            <a>Academics</a>
            <a>Professional</a>
            <a class="logout">logout</a>
        </div>
    </div>
</body>

</html>
